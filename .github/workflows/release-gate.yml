name: Release Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compatibility-gate:
    name: Last-release compatibility (blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Check out the last released tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c "import json,urllib.request; print(json.load(urllib.request.urlopen('https://pypi.org/pypi/epi-recorder/json', timeout=30))['info']['version'])")
          echo LAST_VERSION=$VERSION >> "$GITHUB_ENV"
          git fetch --depth=1 origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          git worktree add "$RUNNER_TEMP/last-release" "v${VERSION}"

      - name: Files sealed by HEAD must verify on the last release
        run: |
          python scripts/check_backward_compatibility.py \
            --last-version "$LAST_VERSION" \
            --last-website "$RUNNER_TEMP/last-release"

  artifact-privacy:
    name: Artifact privacy (committed samples)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Fast, dependency-free: scans every committed .epi for the builder's
      # username, folder paths, interpreter path, argv, PIDs, CPU model and
      # memory. A sample is handed to a counterparty, so a leak here is a
      # disclosure, not a lint. tests/goldens/ is skipped (frozen fixtures).
      - name: Fail if any sealed sample carries host detail
        run: python scripts/check_artifact_privacy.py

  release-gate:
    name: Full test, build, and wheel audit
    needs: compatibility-gate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies only (NOT the package itself)
        # Pins come from pyproject.toml via scripts/ci-install-deps.py —
        # never hardcode them here (a stale copy once tested older libs
        # than the code targets). Still does NOT install the package itself.
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine
          python scripts/ci-install-deps.py

      - name: Run release gate (Windows)
        if: runner.os == 'Windows'
        run: .\scripts\release-gate.ps1 -Python python
        shell: powershell

      - name: Run release gate (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/release-gate.sh python

  experimental:
    name: Experimental surfaces (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies only (NOT the package itself)
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine
          python scripts/ci-install-deps.py

      - name: Run experimental tests
        run: python -m pytest tests -m experimental -q --maxfail=20
