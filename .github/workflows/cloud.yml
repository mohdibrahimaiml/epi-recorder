name: EPI Cloud

on:
  pull_request:
    paths:
      - "cloud/**"
      - ".github/workflows/cloud.yml"
  push:
    branches: [main]
    paths:
      - "cloud/**"
      - ".github/workflows/cloud.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Real-runtime witness test (catches what unit fakes cannot: workerd's
  # SQLite dialect, DO bindings, migration registration). Boots
  # `wrangler dev --local` (no account), seeds D1, fires 200 concurrent
  # signed receipts, and verifies ordering, chain, export, and rejections.
  workerd-e2e:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npx wrangler d1 migrations apply epi-cloud --local --config wrangler.toml
      - name: Start local worker
        run: |
          BOX=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          echo "E2E_BOX=$BOX" >> "$GITHUB_ENV"
          npx wrangler dev --local --port 18788 --config wrangler.toml \
            --var "INBOX_SECRET_KEY:$BOX" > ../dev.log 2>&1 &
          echo $! > ../dev.pid
      - name: Wait for worker
        run: |
          for i in $(seq 1 36); do
            curl -sf http://127.0.0.1:18788/health && break || sleep 5
          done
          curl -sf http://127.0.0.1:18788/health
      - name: Seed, burst, verify
        run: E2E_INBOX_SECRET_KEY="$E2E_BOX" E2E_BASE=http://127.0.0.1:18788 node test/e2e/witness-burst.mjs
      - name: Stop worker and show logs on failure
        if: always()
        run: |
          kill "$(cat ../dev.pid)" 2>/dev/null || true
          if [ "${{ job.status }}" != "success" ]; then cat ../dev.log; fi

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      # Schema before code: the Worker queries columns/tables that only
      # exist after migrations (e.g. users.email_verified, device_codes).
      # Applying first means code never goes live ahead of its database;
      # a failed apply stops the job before deploy. 0001 is IF NOT EXISTS
      # so hand-created prod tables converge instead of erroring.
      - name: Apply D1 migrations (prod)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if grep -q 'TODO-founder' wrangler.toml; then
            echo "database_id placeholder still present — skipping migrations (docs/CLOUD.md §4)."
            exit 0
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set — skipping migrations."
            exit 0
          fi
          npx wrangler d1 migrations apply epi-cloud --remote --config wrangler.toml
      - name: Deploy (skips until founder wires database_id)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if grep -q 'TODO-founder' wrangler.toml; then
            echo "database_id placeholder still present — skipping deploy (docs/CLOUD.md §4)."
            exit 0
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set — skipping deploy."
            exit 0
          fi
          npx wrangler deploy --config wrangler.toml
      # Read-only tripwire on the newest schema: fails the job (loudly)
      # if prod D1 is behind the deployed code. LIMIT 0 returns no rows.
      - name: Smoke check newest schema (prod)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if grep -q 'TODO-founder' wrangler.toml; then
            echo "database_id placeholder still present — skipping smoke check."
            exit 0
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set — skipping smoke check."
            exit 0
          fi
          npx wrangler d1 execute epi-cloud --remote --config wrangler.toml \
            --command "SELECT email_verified FROM users LIMIT 0" --json
          npx wrangler d1 execute epi-cloud --remote --config wrangler.toml \
            --command "SELECT user_code FROM device_codes LIMIT 0" --json
          npx wrangler d1 execute epi-cloud --remote --config wrangler.toml \
            --command "SELECT customer_label FROM api_keys LIMIT 0" --json
