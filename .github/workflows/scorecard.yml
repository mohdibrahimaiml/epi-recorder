# OpenSSF Scorecard (free): public supply-chain health score for the repo.
# Results publish to Security > Code scanning and (optionally) the OpenSSF badge.
# How to read it: docs/GOVERNANCE.md points here; fix top findings before claiming posture.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      # Needed to upload results and publish to the OpenSSF REST API dashboard.
      id-token: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Read-only PAT would go here for private repos / higher rate limits.
          # Public repo: default GITHUB_TOKEN is enough.
          publish_results: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
