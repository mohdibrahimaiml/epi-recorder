name: Build Windows Installer

on:
  push:
    tags:
      - "v*.*.*"        # triggers on v2.7.2, v3.0.0, etc.
  workflow_dispatch:    # also allow manual trigger from GitHub UI
    inputs:
      tag:
        description: "Tag to build for, e.g. v4.7.0 (empty = the ref you dispatch on)"
        required: false
        type: string

permissions:
  contents: write
  # Sigstore signing (free, transparent) mints short-lived certs via GitHub OIDC.
  id-token: write

jobs:
  build-installer:
    name: Build epi-setup-*.exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # See sbom.yml: `tag` builds an already-published tag without re-tagging.
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install epi-recorder and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          pip install -e ".[dev]"
          pip install build twine
          pip install pyinstaller

      - name: Run release gate
        run: |
          .\scripts\release-gate.ps1 -Python python
        shell: powershell

      - name: Run policy/fault-analysis smoke test
        run: |
          python scripts/smoke_policy_fault_analysis.py

      - name: Bundle with PyInstaller
        run: pyinstaller epi.spec --clean --noconfirm

      # Sign the executable that Inno Setup packages, not only the setup .exe.
      # Authenticode on the inner epi.exe is what shows a publisher on the
      # program itself (Properties > Digital Signatures) and lets a reviewer
      # check the binary that actually runs. Off until SignPath issues a second
      # signing policy for it. See docs/WINDOWS-DISTRIBUTION.md.
      - name: Upload bundled exe for signing
        id: unsigned-exe
        if: vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_SIGNING_POLICY_SLUG_EXE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: epi-exe-unsigned
          path: dist/epi/epi.exe
          if-no-files-found: error

      - name: Sign the bundled exe (SignPath Foundation)
        id: signed-exe
        if: vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_SIGNING_POLICY_SLUG_EXE != ''
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG_EXE }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed-exe

      - name: Use the signed exe in the installer
        if: vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_SIGNING_POLICY_SLUG_EXE != ''
        run: |
          $signed = Get-ChildItem "dist\signed-exe" -Recurse -Filter epi.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $signed) { throw "SignPath returned no signed epi.exe" }
          $before = (Get-FileHash "dist\epi\epi.exe" -Algorithm SHA256).Hash
          Copy-Item $signed.FullName "dist\epi\epi.exe" -Force
          $after = (Get-FileHash "dist\epi\epi.exe" -Algorithm SHA256).Hash
          if ($before -eq $after) { throw "the exe was not replaced by a signed copy" }
          $sig = Get-AuthenticodeSignature "dist\epi\epi.exe"
          if ($sig.Status -ne "Valid") { throw "signed exe is not valid: $($sig.Status)" }
          Write-Host "Signed exe: $($sig.SignerCertificate.Subject)"
          Write-Host "SHA-256: $after"
        shell: powershell

      - name: Verify bundle
        run: |
          $exe = "dist\epi\epi.exe"
          if (-not (Test-Path $exe)) { throw "PyInstaller failed - epi.exe not found" }
          Write-Host "Bundle OK: $((Get-Item $exe).Length) bytes"
          & $exe --version

      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress
        shell: powershell

      - name: Build installer
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "installer\windows\setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }
        shell: powershell

      - name: Verify installer
        run: |
          $installer = Get-ChildItem "installer\windows\Output\epi-setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer not found" }
          Write-Host "Installer: $($installer.Name) - $([math]::Round($installer.Length / 1MB, 1)) MB"
        shell: powershell

      # Authenticode signing through SignPath Foundation (free for open-source
      # projects). Off until the project is approved and these are set:
      #   repository variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
      #                        SIGNPATH_SIGNING_POLICY_SLUG
      #   repository secret    SIGNPATH_API_TOKEN
      # Until then the installer is published unsigned, as before. Signing runs
      # before SHA256SUMS and Sigstore, so both cover the signed file.
      # See docs/WINDOWS-DISTRIBUTION.md and CODE_SIGNING_POLICY.md.
      - name: Upload unsigned installer for signing
        id: unsigned-installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: epi-setup-unsigned
          path: installer/windows/Output/epi-setup-*.exe
          if-no-files-found: error

      - name: Sign the installer (SignPath Foundation)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: installer/windows/Output/signed

      - name: Check the signature and use the signed installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: powershell
        run: |
          $signed = Get-ChildItem "installer\windows\Output\signed\epi-setup-*.exe" | Select-Object -First 1
          if (-not $signed) { throw "SignPath returned no installer" }
          $sig = Get-AuthenticodeSignature $signed.FullName
          if ($sig.Status -ne 'Valid') { throw "Signature check failed: $($sig.Status) $($sig.StatusMessage)" }
          Write-Host "Signed by: $($sig.SignerCertificate.Subject)"
          Copy-Item $signed.FullName "installer\windows\Output\$($signed.Name)" -Force
          Remove-Item "installer\windows\Output\signed" -Recurse -Force

      - name: Write SHA256SUMS
        run: |
          Get-ChildItem "installer\windows\Output\epi-setup-*.exe" | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Out-File -Encoding ascii "installer\windows\Output\SHA256SUMS.txt"
          Get-Content "installer\windows\Output\SHA256SUMS.txt"
        shell: powershell

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        with:
          # See sbom.yml: an explicit tag_name is required when github.ref is a
          # branch (a workflow_dispatch targeting an existing tag).
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            installer/windows/Output/epi-setup-*.exe
            installer/windows/Output/SHA256SUMS.txt
          # Attach the exe + checksums first, so the release is complete even
          # if Sigstore signing below hiccups. Do not rewrite notes - a human-written body
          # is already on the Release from the tag/publish step.
          # The exe is Authenticode-signed only when SignPath is configured
          # (see above). SHA256SUMS lets a reviewer confirm bytes either way.
          # A re-run for an existing tag (for example to publish a signed
          # installer after SignPath approval) must replace the same-named
          # assets, not fail on duplicates or leave the old unsigned bytes.
          # The action defaults this to true; pin it so an action bump cannot
          # turn a re-signing into a broken release.
          overwrite_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pinned to a real release: sigstore publishes no floating `v3` tag, so
      # `@v3` could not be resolved and the job died in 4s at action download.
      - name: Sigstore-sign exe + checksums (free, transparent)
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: |
            installer/windows/Output/epi-setup-*.exe
            installer/windows/Output/SHA256SUMS.txt

      - name: Check the Sigstore bundles exist
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $bundles = Get-ChildItem "installer/windows/Output/*.sigstore.json" -ErrorAction SilentlyContinue
          if (-not $bundles) { throw "no Sigstore bundles were produced" }
          $bundles | ForEach-Object { "bundle: $($_.Name)" }

      - name: Attach Sigstore bundles to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: installer/windows/Output/*.sigstore.json
          overwrite_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
