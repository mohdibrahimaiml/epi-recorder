name: Build Windows Installer

on:
  push:
    tags:
      - "v*.*.*"        # triggers on v2.7.2, v3.0.0, etc.
  workflow_dispatch:    # also allow manual trigger from GitHub UI
    inputs:
      tag:
        description: "Tag to build for, e.g. v4.7.0 (empty = the ref you dispatch on)"
        required: false
        type: string

permissions:
  contents: write
  # Sigstore signing (free, transparent) mints short-lived certs via GitHub OIDC.
  id-token: write

jobs:
  build-installer:
    name: Build epi-setup-*.exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # See sbom.yml: `tag` builds an already-published tag without re-tagging.
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install epi-recorder and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          pip install -e ".[dev]"
          pip install build twine
          pip install pyinstaller

      - name: Run release gate
        run: |
          .\scripts\release-gate.ps1 -Python python
        shell: powershell

      - name: Run policy/fault-analysis smoke test
        run: |
          python scripts/smoke_policy_fault_analysis.py

      - name: Bundle with PyInstaller
        run: pyinstaller epi.spec --clean --noconfirm

      - name: Verify bundle
        run: |
          $exe = "dist\epi\epi.exe"
          if (-not (Test-Path $exe)) { throw "PyInstaller failed - epi.exe not found" }
          Write-Host "Bundle OK: $((Get-Item $exe).Length) bytes"
          & $exe --version

      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress
        shell: powershell

      - name: Build installer
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "installer\windows\setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }
        shell: powershell

      - name: Verify installer
        run: |
          $installer = Get-ChildItem "installer\windows\Output\epi-setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer not found" }
          Write-Host "Installer: $($installer.Name) - $([math]::Round($installer.Length / 1MB, 1)) MB"
        shell: powershell

      - name: Write SHA256SUMS
        run: |
          Get-ChildItem "installer\windows\Output\epi-setup-*.exe" | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Out-File -Encoding ascii "installer\windows\Output\SHA256SUMS.txt"
          Get-Content "installer\windows\Output\SHA256SUMS.txt"
        shell: powershell

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v3
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        with:
          # See sbom.yml: an explicit tag_name is required when github.ref is a
          # branch (a workflow_dispatch targeting an existing tag).
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            installer/windows/Output/epi-setup-*.exe
            installer/windows/Output/SHA256SUMS.txt
          # Attach the exe + checksums first, so the release is complete even
          # if Sigstore signing below hiccups. Do not rewrite notes - a human-written body
          # is already on the Release from the tag/publish step.
          # NOTE: the exe is not Authenticode code-signed yet (no cert).
          # SHA256SUMS lets a reviewer confirm bytes; it is not a signature.
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pinned to a real release: sigstore publishes no floating `v3` tag, so
      # `@v3` could not be resolved and the job died in 4s at action download.
      - name: Sigstore-sign exe + checksums (free, transparent)
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: |
            installer/windows/Output/epi-setup-*.exe
            installer/windows/Output/SHA256SUMS.txt

      - name: Attach Sigstore bundles to GitHub Release
        uses: softprops/action-gh-release@v3
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: installer/windows/Output/*.sigstore
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
