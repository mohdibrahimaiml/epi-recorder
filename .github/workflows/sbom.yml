# Build a CycloneDX SBOM for the shipped Python distribution and attach it
# to the GitHub Release (tags) plus keep it as a workflow artifact.
# Independent job: it can never block the installer or PyPI publish paths.
name: SBOM

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build for, e.g. v4.7.0 (empty = the ref you dispatch on)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          # `tag` lets an already-published tag be built after the fact: the
          # workflow file is read from the dispatch ref, so pointing this at the
          # tag is the only way to get its tree without re-tagging.
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package and SBOM tool
        run: |
          python -m pip install --upgrade pip
          # Pin the CLI generation: the flags below are cyclonedx-py 7.x
          # (`--of`/`-o`). The 3.x spelling (`--format`/`--output`) was removed.
          pip install . "cyclonedx-bom>=7,<8"

      - name: Generate SBOM (resolved environment)
        run: |
          cyclonedx-py environment --of json -o sbom.cdx.json
          python -c "import json; d=json.load(open('sbom.cdx.json')); print('components:', len(d.get('components', [])))"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cdx
          path: sbom.cdx.json

      - name: Attach SBOM to GitHub Release
        uses: softprops/action-gh-release@v3
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        with:
          files: sbom.cdx.json
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
