name: Standalone verifier

# Build the dependency-free `epi-verify` binary for auditors with no Python.
# Artifacts are unsigned here on purpose: signing keys live outside CI.
# See docs/STANDALONE-VERIFIER.md.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Build epi-verify
        run: python -m PyInstaller verifier.spec --clean --noconfirm --distpath dist-verifier

      - name: Smoke test the binary
        shell: bash
        run: |
          BIN="dist-verifier/epi-verify"
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          "$BIN" --version
          "$BIN" --help

      - name: Hash the artifact
        shell: bash
        run: |
          BIN="dist-verifier/epi-verify"
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          python - "$BIN" <<'PY'
          import hashlib, sys, pathlib
          p = pathlib.Path(sys.argv[1])
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          print(f"{p.name}  sha256={digest}  bytes={p.stat().st_size}")
          (p.parent / (p.name + ".sha256")).write_text(f"{digest}  {p.name}\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: epi-verify-${{ matrix.os }}
          path: |
            dist-verifier/epi-verify
            dist-verifier/epi-verify.exe
            dist-verifier/epi-verify.sha256
          if-no-files-found: ignore
          retention-days: 30
