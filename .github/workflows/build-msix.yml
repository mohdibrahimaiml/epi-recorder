# Build the Microsoft Store package (.msix).
#
# The Microsoft Store signs packages for free when it publishes them, so this
# workflow produces an unsigned .msix to upload in Partner Center. It also runs
# on pull requests that touch the package files, with a test identity, and
# installs a self-signed copy on the runner to prove the package installs and
# that `epi` and `.epi` files work from it.
#
# Store identity (set these as repository variables once the app is reserved in
# Partner Center, from: your app > Product management > Product identity):
#   MSIX_IDENTITY_NAME           Package/Identity/Name
#   MSIX_PUBLISHER               Package/Identity/Publisher ("CN=...")
#   MSIX_PUBLISHER_DISPLAY_NAME  Package/Properties/PublisherDisplayName
# Without them the build uses a test identity the Store would reject.
name: Build MSIX (Microsoft Store)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v4.11.2 (empty = the ref you dispatch on)"
        required: false
        type: string
  pull_request:
    paths:
      - "installer/msix/**"
      - "scripts/build_msix.ps1"
      - "scripts/msix_assets.py"
      - ".github/workflows/build-msix.yml"

permissions:
  contents: read

jobs:
  build-msix:
    name: Build EPIRecorder-*.msix
    runs-on: windows-latest
    env:
      # Passed as data, never pasted into a script (no template injection).
      IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'EPILabs.EPIRecorder.Test' }}
      PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=EPI Labs Test' }}
      PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'EPI Labs' }}
      TEST_PUBLISHER: "CN=EPI Labs Test"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      # Pillow makes the package logos from epi.ico (scripts/msix_assets.py).
      - name: Install epi-recorder, PyInstaller and Pillow
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
          pip install pyinstaller pillow

      - name: Bundle with PyInstaller
        run: pyinstaller epi.spec --clean --noconfirm

      - name: Build the MSIX
        shell: powershell
        run: |
          $version = python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          .\scripts\build_msix.ps1 -Version $version -IdentityName $env:IDENTITY_NAME `
            -Publisher $env:PUBLISHER -PublisherDisplayName $env:PUBLISHER_DISPLAY_NAME

      # Install a self-signed copy (test identity only) and run it. The uploaded
      # artifact stays unsigned. Non-blocking while the runner's support for
      # sideloading is proven; read this step's log before submitting.
      - name: Smoke test - install a test-signed copy and run it
        if: env.PUBLISHER == env.TEST_PUBLISHER
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $msix = Get-ChildItem "installer\msix\Output\*.msix" | Select-Object -First 1
          $copy = Join-Path $env:RUNNER_TEMP "test-signed.msix"
          Copy-Item $msix.FullName $copy
          $cert = New-SelfSignedCertificate -Type Custom -Subject $env:TEST_PUBLISHER `
            -KeyUsage DigitalSignature -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pwd = ConvertTo-SecureString -String ([guid]::NewGuid().ToString()) -Force -AsPlainText
          $pfx = Join-Path $env:RUNNER_TEMP "test.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pwd | Out-Null
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation "Cert:\LocalMachine\TrustedPeople" -Password $pwd | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          $plain = [Runtime.InteropServices.Marshal]::PtrToStringAuto([Runtime.InteropServices.Marshal]::SecureStringToBSTR($pwd))
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $plain $copy
          if ($LASTEXITCODE -ne 0) { throw "test signing failed" }
          Add-AppxPackage -Path $copy
          $pkg = Get-AppxPackage -Name $env:IDENTITY_NAME
          if (-not $pkg) { throw "package did not install" }
          Write-Host "Installed: $($pkg.PackageFullName)"
          $alias = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\epi.exe"
          & $alias --version
          if ($LASTEXITCODE -ne 0) { throw "epi --version failed from the installed package" }
          & $alias verify (Resolve-Path "website\assets\sample.epi")
          Remove-AppxPackage -Package $pkg.PackageFullName

      - name: Write SHA256SUMS
        shell: powershell
        run: |
          Get-ChildItem "installer\msix\Output\*.msix" | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Out-File -Encoding ascii "installer\msix\Output\SHA256SUMS.txt"
          Get-Content "installer\msix\Output\SHA256SUMS.txt"

      - name: Upload the MSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: epi-msix
          path: |
            installer/msix/Output/*.msix
            installer/msix/Output/SHA256SUMS.txt
          if-no-files-found: error
