name: Storage interop (MinIO)

# M4 acceptance: 100 sealed runs land in a real S3-speaking bucket with
# matching sha256. MinIO runs as a service; the same test file runs locally
# against moto_server (or skips when neither is available).

on:
  pull_request:
    paths:
      - "epi_core/storage_sink.py"
      - "epi_recorder/api.py"
      - "epi_gateway/main.py"
      - "epi_cli/cloud.py"
      - "tests/test_storage_*.py"
      - "pyproject.toml"
      - ".github/workflows/storage-minio.yml"
  push:
    branches: [main]
    paths:
      - "epi_core/storage_sink.py"
      - "tests/test_storage_interop.py"

jobs:
  minio:
    runs-on: ubuntu-latest
    services:
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip && python scripts/ci-install-deps.py
      - run: pip install boto3
      - name: Create bucket
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
        run: |
          python -c "
          import boto3
          c = boto3.client('s3', endpoint_url='http://127.0.0.1:9000',
                            region_name='us-east-1',
                            aws_access_key_id='minioadmin',
                            aws_secret_access_key='minioadmin123')
          c.create_bucket(Bucket='epi-interop')
          print('bucket ready')
          "
      - name: Sink unit tests
        run: python -m pytest tests/test_storage_sink.py -q -o addopts=""
      - name: Interop incl. 100-seal acceptance
        env:
          EPI_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          EPI_TEST_S3_ACCESS: minioadmin
          EPI_TEST_S3_SECRET: minioadmin123
          EPI_TEST_S3_BUCKET: epi-interop
          EPI_TEST_S3_REGION: us-east-1
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
        run: python -m pytest tests/test_storage_interop.py -q -o addopts=""
