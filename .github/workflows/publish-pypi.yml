# Publish epi-recorder to PyPI via Trusted Publishing (no tokens).
#
# Flow: founder drafts a GitHub Release (tag vX.Y.Z on main) -> this builds
# the sdist/wheel from a clean checkout of THAT TAG, checks them, refuses a
# tag/version mismatch, and uploads. PEP 740 attestations are on by default.
# One-time setup (founder, ~3 min): PyPI -> epi-recorder -> Publishing ->
# add GitHub publisher (owner mohdibrahimaiml, repo epi-recorder, workflow
# publish-pypi.yml, environment pypi). Then delete all PyPI API tokens.
name: Publish to PyPI (Trusted Publishing)

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish epi-recorder
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist --wheel

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Refuse tag/version mismatch
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "${TAG#v}" = "$VERSION" || { echo "refusing: tag $TAG builds version $VERSION"; exit 1; }
          ls dist/epi_recorder-"$VERSION".tar.gz "dist/epi_recorder-${VERSION}-py3-none-any.whl"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
