name: Dashboard guided-flow browser test

# Boots real workerd (`wrangler dev --local`, isolated persist dir), seeds
# one owner session into local D1, and walks the cloud dashboard guided
# start on a 390px phone viewport the way a new customer would (company ->
# connect -> first run -> customer -> trust link -> tabs), with screenshots
# committed under docs/dashboard-v2/.

on:
  pull_request:
    paths:
      - "cloud/src/index.ts"
      - "cloud/src/ui.ts"
      - "cloud/src/do/witness.ts"
      - "cloud/src/routes/auth.ts"
      - "cloud/src/routes/keys.ts"
      - "cloud/src/routes/shares.ts"
      - "cloud/src/routes/inboxes.ts"
      - "cloud/src/routes/artifacts.ts"
      - "cloud/src/routes/orgs.ts"
      - "epi_cli/record.py"
      - "epi_cli/run.py"
      - "epi_cli/_shared.py"
      - "website/t/app.js"
      - "website/verify/index.html"
      - "website/js/home-verify.js"
      - "website/js/auth-ui.js"
      - "functions/v1/**"
      - "tests/test_dashboard_guided.py"
      - "tests/test_trust_walkthrough_e2e.py"
      - "tests/test_verify_drop.py"
      - "tests/test_nav_signed_in.py"
      - ".github/workflows/dashboard-browser.yml"
  push:
    branches: [main]
    paths:
      - "cloud/src/index.ts"
      - "cloud/src/ui.ts"
      - "cloud/src/do/witness.ts"
      - "cloud/src/routes/auth.ts"
      - "cloud/src/routes/keys.ts"
      - "cloud/src/routes/shares.ts"
      - "cloud/src/routes/inboxes.ts"
      - "cloud/src/routes/artifacts.ts"
      - "cloud/src/routes/orgs.ts"
      - "epi_cli/record.py"
      - "epi_cli/run.py"
      - "epi_cli/_shared.py"
      - "website/t/app.js"
      - "website/verify/index.html"
      - "website/js/home-verify.js"
      - "website/js/auth-ui.js"
      - "functions/v1/**"
      - "tests/test_dashboard_guided.py"
      - "tests/test_trust_walkthrough_e2e.py"
      - "tests/test_verify_drop.py"
      - "tests/test_nav_signed_in.py"
      - ".github/workflows/dashboard-browser.yml"
  workflow_dispatch:

jobs:
  guided-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      - name: Install Python dependencies (NOT the package itself)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python scripts/ci-install-deps.py
          python -m pip install "playwright>=1.45.0" "pytest-playwright>=0.5.0"

      - name: Install cloud dependencies (wrangler)
        run: npm ci
        working-directory: cloud

      - name: Install chromium
        run: python -m playwright install --with-deps chromium

      - name: Walk the guided flow on a 390px phone
        run: python -m pytest tests/test_dashboard_guided.py -q --maxfail=1

      - name: Unit-test the Pages trust proxy
        run: node --test functions/v1/trust-proxy.test.mjs

      - name: Vendor to reviewer to auditor end to end (real workerd + Chromium)
        run: python -m pytest tests/test_trust_walkthrough_e2e.py -q --maxfail=1

      - name: Verify page drop zone with a real synthetic drop
        run: python -m pytest tests/test_verify_drop.py -q --maxfail=1

      - name: Site nav reflects cloud sign-in
        run: python -m pytest tests/test_nav_signed_in.py -q --maxfail=1
