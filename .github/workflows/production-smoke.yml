# Production smoke: the public surfaces must answer, once a day.
#
# This is not a unit test. It checks the deployed product the way a visitor
# reaches it: Pages, the verifier, pricing, Cloud health, and the retired
# verify host. A failed run wakes the maintainer through GitHub notifications.
name: Production smoke

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      # Fetch first, then match. `curl | grep -q` would kill curl with
      # "Failure writing output to destination" as soon as grep exits.
      - name: Pages and trust anchors
        run: |
          set -euo pipefail

          # Say WHICH check failed and why. The old version was silent under
          # `set -e`, so a single stale anchor failed the run with no clue
          # beyond "exit code 1".
          check() {
            local url="$1" needle="$2" body
            if ! body=$(curl -fsS --max-time 30 "$url"); then
              echo "FAIL: could not fetch $url" >&2
              return 1
            fi
            if ! grep -qF "$needle" <<<"$body"; then
              echo "FAIL: $url does not contain '$needle'" >&2
              echo "      (page returned $(wc -c <<<"$body") bytes)" >&2
              return 1
            fi
            echo "ok: $url contains '$needle'"
          }

          # Anchors are product claims, not marketing copy. The homepage line
          # moved from "Decision records" to "Decision Record" in the Nov 2026
          # site rewrite; #[259] changed the page, this check had not caught up.
          check https://epilabs.org/ "Decision Record"
          check https://epilabs.org/verify/ "Verify a .epi file"
          check https://epilabs.org/plans "Create a free workspace"
          check https://epilabs.org/reviewers "4.9.0"
          check https://epilabs.org/.well-known/did.json '"id"'
          check https://epilabs.org/.well-known/security.txt "Contact:"

      - name: Cloud health
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' https://cloud.epilabs.org/health)
          test "$code" = "200"
          body=$(curl -fsS https://cloud.epilabs.org/)
          grep -qF "no approval step" <<<"$body"

      - name: Legacy verify host redirects
        run: |
          set -euo pipefail
          headers=$(curl -sI https://verify.epilabs.org/)
          code=$(awk 'NR==1{print $2}' <<<"$headers")
          location=$(awk 'tolower($1)=="location:"{print $2}' <<<"$headers" | tr -d '\r')
          test "$code" = "301"
          test "$location" = "https://epilabs.org/verify/"

      - name: Summary
        run: |
          {
            echo "### Production smoke passed"
            echo "- epilabs.org, /verify, /plans, /reviewers"
            echo "- .well-known/did.json and security.txt"
            echo "- cloud.epilabs.org/health"
            echo "- verify.epilabs.org -> epilabs.org/verify (301)"
          } >> "$GITHUB_STEP_SUMMARY"
