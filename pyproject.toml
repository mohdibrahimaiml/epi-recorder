[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epi-recorder"
version = "4.10.0"
description = "Decision records for AI agents: one signed .epi file per decision that your customer, auditor or regulator can check offline."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Mohd Ibrahim Afridi", email = "mohdibrahim@epilabs.org"}
]
maintainers = [
    {name = "Mohd Ibrahim Afridi", email = "mohdibrahim@epilabs.org"}
]
keywords = [
    "evidence",
    "forensics",
    "audit",
    "compliance",
    "cryptography",
    "ai",
    "llm",
    "verification",
    "artifact",
    "debugging",
    "bug-report",
    "incident-response",
    "pytest",
    "ci",
    "execution-trace",
    "reproducibility",
    "decision-records",
    "aiuc-1",
    "aiuc"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Logging",
    "Typing :: Typed",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
]

dependencies = [
    "pydantic>=2.14.3,<3.0.0",
    "cryptography>=50.0.2,<51",
    "cbor2>=6.2.1",
    "rfc8785>=0.1.4",
    "asn1crypto>=1.5.1,<2",
    "typer>=0.28.0,<0.29.0",
    "click>=8.5.1,<9.0.0",
    "rich>=15.0.0,<16",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
ai = [
    "google-generativeai>=0.8.6",
]
openai = [
    "openai>=3.46.0",
]
anthropic = [
    "anthropic>=2.6.0",
]
# Framework adapters and their dependencies ship in epi-enterprise.
analytics = [
    "pandas>=3.1.1",
    "matplotlib>=3.11.2",
]
pdf = [
    "fpdf2>=2.9.0",
]
# Signing keys held in an HSM or cloud KMS (docs/KEY-CUSTODY.md)
pkcs11 = [
    "python-pkcs11>=0.10.1",
]
aws-kms = [
    "boto3>=1.43.126",
]
gcp-kms = [
    "google-cloud-kms>=3.18.0",
]
# The team gateway dependencies moved to epi-enterprise.
mcp = [
    "mcp>=2.3.0",
]
all = [
    "google-generativeai>=0.8.6",
    "openai>=3.46.0",
    "anthropic>=2.6.0",
    "pandas>=3.1.1",
    "matplotlib>=3.11.2",
    "boto3>=1.43.126",
]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "black>=26.10.1",
    "ruff>=0.17.4",
    "pandas>=3.1.1",
    "fastapi>=0.162.2,<1",
    "uvicorn>=0.54.0,<1",
    "python-multipart>=0.0.33",
    "wrapt>=2.5.2",
    "mcp>=2.3.0",
]
test = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-playwright>=0.10.0",
    "playwright>=1.64.1",
    "httpx>=0.28.1",
    "fastapi>=0.162.2,<1",
    "uvicorn>=0.54.0,<1",
    "python-multipart>=0.0.33",
    "pandas>=3.1.1",
    "litellm>=1.108.3",
    "langchain-core>=1.7.6",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "wrapt>=2.5.2",
    "anyio",
    "boto3>=1.43.126",  # S3 interop tests (bucket setup + independent read-back)
    "agentrust-trace>=0.11.0",
    "agentrust-trace-tests>=0.6.2",
    "mcp>=2.3.0",
]

[project.scripts]
epi = "epi_cli.main:cli_main"
epi-register = "epi_cli.register:cli_main"
epi-mcp = "epi_mcp.server:main"
epi-mcp-http = "epi_mcp.http:main"

[project.urls]
Homepage = "https://epilabs.org"
Documentation = "https://epilabs.org/docs"
Repository = "https://github.com/mohdibrahimaiml/epi-recorder"
Issues = "https://github.com/mohdibrahimaiml/epi-recorder/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["epi_core*", "epi_cli*", "epi_recorder*", "epi_analyzer*", "epi_viewer_static*", "web_viewer*", "epi_postinstall*", "pytest_epi*", "epi_mcp*"]
exclude = ["tests", "tests.*", "*.tests", "*.tests.*", "*tests*"]

[tool.setuptools]
py-modules = ["epi_postinstall"]

[tool.setuptools.package-data]
epi_core = ["assets/*.ico", "assets/tsa_roots/*"]
epi_viewer_static = ["*.html", "*.js", "*.css"]
web_viewer = ["*.html", "*.js", "*.css"]

[project.entry-points.pytest11]
epi = "pytest_epi.plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = ["tmp*", ".gen_tmp", ".tmp", ".pytest_cache", "htmlcov"]
addopts = "-v --cov=epi_core --cov=epi_cli --cov=epi_gateway --cov=epi_recorder --cov=pytest_epi --cov-report=term-missing --cov-report=html"
markers = [
    "unit: fast unit and adapter tests",
    "integration: multi-component offline tests",
    "security: cryptographic, redaction, and trust-boundary tests",
    "browser: browser-rendered viewer tests",
    "framework: optional framework integration tests",
    "e2e: full-system end-to-end lifecycle tests",
    "compliance: evidence-readiness and compliance-claim consistency tests",
    "slow: long-running or higher-cost local tests",
    "network: tests that are allowed to use external network access",
    "experimental: frozen experimental surfaces (excluded from the core release gate)",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
