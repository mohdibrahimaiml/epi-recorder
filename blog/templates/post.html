<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{{ title }} - EPI Labs</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="EPI Labs">
<meta property="og:title" content="{{ title }} - EPI Labs">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ image }}">
<meta property="article:published_time" content="{{ date_iso }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ title }} - EPI Labs">
<meta name="twitter:description" content="{{ description }}">
<meta name="twitter:image" content="{{ image }}">
<meta name="theme-color" content="#F7F5F0">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="/css/aos.css">
<link rel="stylesheet" href="/css/site.css?v=15">
<link rel="stylesheet" href="/css/blog.css?v=1">
<script type="application/ld+json">{{ json_ld }}</script>
<script>
(function(){try{var t=localStorage.getItem('epi-theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)}catch(e){}})();
</script>
</head>
<body class="canvas">
<a class="skip" href="#main">Skip to content</a>
{{ nav }}
<main id="main">
<div class="page blog-post">
<a class="blog-back" href="/blog/">&larr; All posts</a>
<span class="tag"><span class="n">{{ date }}</span></span>
<h1>{{ title }}</h1>
<p class="lede">{{ description }}</p>
<div class="blog-body">
{{ content }}
</div>
<div class="blog-cta">
  <p><strong>Check a record yourself.</strong> Verification runs on your machine, needs no account, and is never charged.</p>
  <p><a class="btn btn-pri" href="/verify/">Verify a .epi file</a> <a class="btn btn-sec" href="/decision-record">What is a Decision Record?</a></p>
</div>
</div>
</main>
{{ footer }}
<script src="/js/theme.js"></script>
<script>
(function(){
  var nav=document.getElementById('nav');
  if(nav){var onS=function(){nav.classList.toggle('scrolled',scrollY>10)};addEventListener('scroll',onS,{passive:true});onS();}
  var b=document.getElementById('burger'),m=document.getElementById('mmenu');
  if(b&&m)b.addEventListener('click',function(){var o=m.classList.toggle('open');b.classList.toggle('x',o);b.setAttribute('aria-expanded',o);document.body.style.overflow=o?'hidden':''});
})();
</script>
<script src="/js/aos.js"></script>
<script>AOS.init({duration:700,easing:"ease-out-cubic",once:true,offset:80});</script>
<script src="/js/auth-ui.js?v=2"></script>
</body>
</html>
