<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{{ title }} | EPI Labs</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="EPI Labs">
<meta property="og:title" content="{{ title }} | EPI Labs">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ image }}">
<meta property="article:published_time" content="{{ date_iso }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ title }} | EPI Labs">
<meta name="twitter:description" content="{{ description }}">
<meta name="twitter:image" content="{{ image }}">
<meta name="theme-color" content="#070708">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="/css/zenjin-epi.css">
<script type="application/ld+json">{{ json_ld }}</script>
<style>
  .blog-body p { font-size:0.875rem; line-height:1.7; color:var(--text-body); margin-top:0.9rem; }
  .blog-body h2 { font-family:var(--font-sans); font-size:1.5rem; font-weight:400; letter-spacing:-0.02em; color:var(--foreground); margin-top:2.5rem; }
  .blog-body h3 { font-family:var(--font-sans); font-size:1.125rem; font-weight:500; color:var(--foreground); margin-top:1.75rem; }
  .blog-body ul, .blog-body ol { font-size:0.875rem; line-height:1.7; color:var(--text-body); margin-top:0.9rem; padding-left:1.4rem; }
  .blog-body ul { list-style:disc; } .blog-body ol { list-style:decimal; }
  .blog-body li { margin-top:0.35rem; }
  .blog-body a { color:var(--acc); text-decoration:underline; text-underline-offset:3px; }
  .blog-body pre { overflow-x:auto; font-family:var(--font-mono); font-size:0.78rem; line-height:1.6; color:var(--text-secondary); background:var(--stage); padding:1rem; border:1px solid var(--border-grid); margin-top:1rem; }
  .blog-body code { font-family:var(--font-mono); font-size:0.9em; }
  .blog-body blockquote { border-left:2px solid var(--border-grid); padding-left:1rem; color:var(--text-secondary); margin-top:1rem; }
  .blog-body table { border-collapse:collapse; width:100%; font-size:0.85rem; margin-top:1rem; }
  .blog-body th, .blog-body td { text-align:left; padding:0.5rem 0.75rem; border-bottom:1px solid var(--border-grid); vertical-align:top; }
</style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
{{ header }}

  <main id="main-content" style="padding-top:3.5rem">
    <div class="z-shell">
      <div class="z-gutter z-gutter--left" aria-hidden="true"></div>
      <header class="z-intro-grid__title z-blur-in z-blur-in--d1" style="border-right:0">
        <span class="z-eyebrow">Blog &middot; <time datetime="{{ date_iso }}">{{ date }}</time></span>
        <h1 class="z-h1" style="margin-top:1rem">{{ title }}</h1>
        <p class="z-body" style="margin-top:1.25rem;max-width:36rem">{{ description }}</p>
        <p style="margin-top:1.5rem"><a href="/blog/" style="color:var(--text-secondary);font-size:0.85rem">&larr; All posts</a></p>
      </header>
      <div style="padding:2.5rem clamp(1.5rem, 5vw, 3rem) 4rem">
        <div style="max-width:46rem">
          <div class="blog-body">{{ content }}</div>
          <div style="border:1px solid var(--border-grid);padding:1.5rem;margin-top:3rem">
            <p class="z-body" style="margin:0"><strong>Check a record yourself.</strong> Verification runs on your machine, needs no account, and is never charged.</p>
            <p style="margin-top:1rem"><a class="z-btn-primary" href="/verify/">Verify a .epi file</a> <a class="z-btn-ghost" href="/decision-record" style="margin-left:0.5rem">What is a Decision Record?</a></p>
          </div>
        </div>
      </div>
      <div class="z-gutter z-gutter--right" aria-hidden="true"></div>
    </div>
  </main>

{{ footer }}

  <script src="/js/auth-ui.js"></script>
  <script src="/js/zenjin-epi.js"></script>
</body>
</html>
