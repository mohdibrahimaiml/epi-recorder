<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Blog - EPI Labs</title>
<meta name="description" content="Technical notes on AI decision evidence, cryptographic provenance, release control, and what a record can and cannot prove.">
<link rel="canonical" href="https://epilabs.org/blog/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="EPI Labs">
<meta property="og:title" content="Blog - EPI Labs">
<meta property="og:description" content="Technical notes on AI decision evidence, cryptographic provenance, release control, and what a record can and cannot prove.">
<meta property="og:url" content="https://epilabs.org/blog/">
<meta property="og:image" content="https://epilabs.org/assets/epi-walkthrough-og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Blog - EPI Labs">
<meta name="twitter:description" content="Technical notes on AI decision evidence, cryptographic provenance, release control, and what a record can and cannot prove.">
<meta name="twitter:image" content="https://epilabs.org/assets/epi-walkthrough-og.jpg">
<meta name="theme-color" content="#F7F5F0">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="/css/aos.css">
<link rel="stylesheet" href="/css/site.css?v=15">
<link rel="stylesheet" href="/css/blog.css?v=1">
<script>
(function(){try{var t=localStorage.getItem('epi-theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)}catch(e){}})();
</script>
</head>
<body class="canvas">
<a class="skip" href="#main">Skip to content</a>
{{ nav }}
<main id="main">
<div class="page blog-index">
<span class="tag">Blog</span>
<h1>Evidence someone else can check</h1>
<p class="lede">Technical notes on AI decision evidence, cryptographic provenance, release control, and the difference between a promise and a record a third party can verify.</p>
<div class="blog-list">
{{ cards }}
</div>
</div>
</main>
{{ footer }}
<script src="/js/theme.js"></script>
<script>
(function(){
  var nav=document.getElementById('nav');
  if(nav){var onS=function(){nav.classList.toggle('scrolled',scrollY>10)};addEventListener('scroll',onS,{passive:true});onS();}
  var b=document.getElementById('burger'),m=document.getElementById('mmenu');
  if(b&&m)b.addEventListener('click',function(){var o=m.classList.toggle('open');b.classList.toggle('x',o);b.setAttribute('aria-expanded',o);document.body.style.overflow=o?'hidden':''});
})();
</script>
<script src="/js/aos.js"></script>
<script>AOS.init({duration:700,easing:"ease-out-cubic",once:true,offset:80});</script>
<script src="/js/auth-ui.js?v=2"></script>
</body>
</html>
