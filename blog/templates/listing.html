<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Blog | EPI Labs</title>
<meta name="description" content="Technical notes on AI decision evidence, cryptographic provenance, release control, and what a record can and cannot prove.">
<link rel="canonical" href="https://epilabs.org/blog/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="EPI Labs">
<meta property="og:title" content="Blog | EPI Labs">
<meta property="og:description" content="Technical notes on AI decision evidence, cryptographic provenance, release control, and what a record can and cannot prove.">
<meta property="og:url" content="https://epilabs.org/blog/">
<meta property="og:image" content="https://epilabs.org/assets/epi-walkthrough-og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Blog | EPI Labs">
<meta name="twitter:description" content="Technical notes on AI decision evidence, cryptographic provenance, release control, and what a record can and cannot prove.">
<meta name="twitter:image" content="https://epilabs.org/assets/epi-walkthrough-og.jpg">
<meta name="theme-color" content="#070708">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="/css/zenjin-epi.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
{{ header }}

  <main id="main-content" style="padding-top:3.5rem">
    <div class="z-shell">
      <div class="z-gutter z-gutter--left" aria-hidden="true"></div>
      <header class="z-intro-grid__title z-blur-in z-blur-in--d1" style="border-right:0">
        <span class="z-eyebrow">Blog</span>
        <h1 class="z-h1" style="margin-top:1rem">Evidence someone else can check</h1>
        <p class="z-body" style="margin-top:1.25rem;max-width:36rem">Technical notes on AI decision evidence, cryptographic provenance, release control, and the difference between a promise and a record a third party can verify.</p>
      </header>
      <div style="padding:2.5rem clamp(1.5rem, 5vw, 3rem) 4rem">
        <div class="z-tri-grid" style="grid-template-columns:repeat(auto-fit,minmax(18rem,1fr))">
{{ cards }}
        </div>
      </div>
      <div class="z-gutter z-gutter--right" aria-hidden="true"></div>
    </div>
  </main>

{{ footer }}

  <script src="/js/auth-ui.js"></script>
  <script src="/js/zenjin-epi.js"></script>
</body>
</html>
