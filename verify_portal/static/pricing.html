<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0;url=/plans">
<link rel="canonical" href="https://epilabs.org/plans">
<title>Redirecting to Plans &amp; Pricing — EPI Labs</title>
<script>
(function(){
  var hash = window.location.hash || '';
  var search = window.location.search || '';
  var target = '/plans' + search + hash;
  if (history && history.replaceState) {
    history.replaceState(null, '', target);
    window.location.replace(target);
  } else {
    window.location.href = target;
  }
})();
</script>

  body{margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;background:#0d1117;color:#c9d1d9}

  .msg a{color:#58a6ff;text-decoration:none}
</style>
</head>
