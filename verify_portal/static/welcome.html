<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Activating your EPI Labs plan…</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<script>
/* Smart redirect: send user straight to /account?checkout=success.
   The real activation banner + plan-polling lives on account.html.
   Using replaceState so the back button skips this page entirely. */
(function () {
  var dest = '/account?checkout=success';
  if (history && history.replaceState) {
    history.replaceState(null, '', dest);
    window.location.replace(dest);
  } else {
    window.location.href = dest;
  }
})();
</script>
<style>
  body{margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;background:#0d1117;color:#c9d1d9}
  .msg{text-align:center;padding:24px}
  .msg h1{font-size:1.4rem;margin:0 0 8px;color:#f0f6fc}
  .msg p{font-size:.9rem;color:#8b949e}
  .msg a{color:#58a6ff;text-decoration:none}
</style>
</head>
<body>
<div class="msg">
  <h1>Activating your plan…</h1>
  <p>Redirecting you to your account. <a href="/account?checkout=success">Click here if you are not redirected.</a></p>
</div>
<script src="/js/auth-ui.js?v=2"></script>
</body>
</html>
