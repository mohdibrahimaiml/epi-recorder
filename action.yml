name: 'EPI Evidence'
description: 'Generate signed, tamper-evident .epi evidence artifacts from pytest AI agent tests'
branding:
  icon: 'shield'
  color: 'blue'
  
inputs:  
  epi-dir:  
    description: 'Directory for .epi evidence files'  
    default: './evidence'  
    required: false  
  epi-on-pass:  
    description: 'Keep evidence for passing tests too'  
    default: 'false'  
    required: false  
  
runs:  
  using: 'composite'  
  steps:  
    - name: Install EPI Recorder from repository source  
      run: pip install .  
      shell: bash  
    - name: Generate evidence  
