services:
  - type: web
    name: epi-verify
    runtime: python
    plan: free
    buildCommand: pip install -e ".[gateway]"
    startCommand: python -m verify_portal.main
    # FREE durable auth: set TURSO_DATABASE_URL + TURSO_AUTH_TOKEN (see docs/FREE_AUTH_DB_SETUP.md).
    # No paid Render disk required when Turso free is configured.
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: PORT
        value: 10000
      - key: EPI_STORAGE_DIR
        value: ./data
      - key: EPI_VERIFY_BASE_URL
        value: https://epi-verify-portal.onrender.com
      - key: EPI_FRONTEND_URL
        value: https://epilabs.org
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: EPI_ATTESTATION_PRIVATE_KEY
        sync: false
      - key: EPI_SCITT_SERVICE_PRIVATE_KEY
        sync: false
      - key: EPI_VERIFY_TELEMETRY_ENABLED
        value: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: EPI_ADMIN_API_KEY
        sync: false
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_CLIENT_TOKEN
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      # Paddle environment — set these to match your live dashboard
      - key: PADDLE_SANDBOX
        value: false
      - key: PADDLE_ENV
        value: live
      # Starter tier (maps → hosted plan internally)
      - key: PADDLE_STARTER_PRICE_ID_MONTHLY
        sync: false
      - key: PADDLE_STARTER_PRICE_ID_YEARLY
        sync: false
      # Pro tier (maps → hosted plan internally)
      - key: PADDLE_PRO_PRICE_ID
        sync: false
      - key: PADDLE_PRO_PRICE_ID_YEARLY
        sync: false
      # Advanced tier (maps → team plan internally)
      - key: PADDLE_ADVANCED_PRICE_ID
        sync: false
      - key: PADDLE_ADVANCED_PRICE_ID_YEARLY
        sync: false
      # Team alias (legacy — mirrors ADVANCED_PRICE_ID if unset)
      - key: PADDLE_TEAM_PRICE_ID
        sync: false
      # Enterprise
      - key: PADDLE_ENTERPRISE_PRICE_ID
        sync: false
      # One-time Agent Evidence Sprint ($1,500)
      - key: PADDLE_SPRINT_PRICE_ID
        sync: false
    domains:
      - verify.epilabs.org
      - api.epilabs.org
  - type: web
    name: epi-mcp
    runtime: python
    plan: free
    buildCommand: pip install -e ".[mcp,gateway]"
    startCommand: epi-mcp-http --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: PORT
        value: 10000
      # Required in production: Bearer token for /mcp and /artifacts.
      # A non-loopback bind without it refuses to start.
      - key: EPI_MCP_TOKEN
        sync: false
      # Public base URL advertised in seal responses, e.g. https://epi-mcp.onrender.com
      - key: EPI_MCP_PUBLIC_URL
        sync: false
      # Random 32+ char secret. Signs OAuth tokens (clients/refresh tokens
      # then survive restarts) and seeds per-caller signing keys (signers stay
      # stable on an ephemeral disk, so `epi keys trust` pinning lasts).
      # Guard it like a root key; rotating it invalidates tokens and changes signers.
      - key: EPI_OAUTH_SECRET
        sync: false
      # OPTIONAL, for private/team servers only. Leave unset for a public server so
      # anyone can connect without friction (storage quotas still apply).
      - key: EPI_APPROVE_PASSPHRASE
        sync: false
      # OPTIONAL sign-in so sealed files name the person: EPI_IDP_ISSUER=github (free OAuth
      # app) or any OpenID Connect issuer. Leave these unset and the connector stays one-click anonymous.
      - key: EPI_IDP_ISSUER
        sync: false
      - key: EPI_IDP_CLIENT_ID
        sync: false
      - key: EPI_IDP_CLIENT_SECRET
        sync: false
      - key: EPI_IDP_NAME
        sync: false
